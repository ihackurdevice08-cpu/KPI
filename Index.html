<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비즈니스 KPI 대시보드</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      padding: 20px 28px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    header p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .frame-wrap {
      width: 100%;
      height: calc(100vh - 86px);
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1>비즈니스 KPI 대시보드</h1>
    <p>Google Sheets → Apps Script Web App → Netlify 구조로 연결한 KPI 대시보드</p>
  </header>

  <div class="frame-wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwNbvhsfW2lA63yYRak9byF2IdwEbYkpMNbNMFq9WoVFCm9eV7VZDhPf3vXCoMy6Pci/exec"
      title="비즈니스 KPI 대시보드">
    </iframe>
  </div>
</body>
</html>
